# Environnement de développement conteneurisé (CDC 4.7, 2.5) : SQLite seul (ADR 0001),
# base stockée sur un volume Docker partagé entre backend et cron.
services:
  backend:
    build: .
    env_file:
      - ./.env
    environment:
      DB_ENGINE: sqlite
      DB_NAME: data/db.sqlite3
    volumes:
      - .:/app
      - backend_media:/app/media
      - backend_data:/app/data
    ports:
      - "8000:8000"

  # CDC 5.2, 5.6 : « Tâches cron » — mêmes image et code que backend, même base
  # de données, mais un processus cron dédié plutôt qu'une tâche de fond dans
  # le serveur applicatif (qui doit rester utilisable même si le cron est coupé).
  cron:
    build: .
    entrypoint: ["/app/docker-entrypoint-cron.sh"]
    env_file:
      - ./.env
    environment:
      DB_ENGINE: sqlite
      DB_NAME: data/db.sqlite3
    volumes:
      - .:/app
      - backend_media:/app/media
      - backend_data:/app/data

volumes:
  backend_media:
  backend_data:
