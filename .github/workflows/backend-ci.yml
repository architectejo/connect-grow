name: CI backend

on:
  push:
    branches: [main, backend, frontend]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main, backend, frontend]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_ENGINE: sqlite
      DB_NAME: ci.sqlite3
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations oubliées
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations sur base vierge
        run: python manage.py migrate --noinput
      - name: Tests (réglages backend.settings_test, sans .env ni DEBUG)
        run: python manage.py test apps
