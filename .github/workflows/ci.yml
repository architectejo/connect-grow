name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_ENGINE: sqlite
      DB_NAME: ci.sqlite3
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations oubliées
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations sur base vierge
        run: python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test apps

  frontend:
    name: Frontend (connect-grow)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connect-grow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: connect-grow/package-lock.json
      - run: npm ci
      # Pas de continue-on-error : un échec de lint doit faire échouer la CI.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
