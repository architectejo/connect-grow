name: CI frontend

on:
  push:
    branches: [main, backend, frontend]
    paths: ["connect-grow/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: [main, backend, frontend]
    paths: ["connect-grow/**", ".github/workflows/frontend-ci.yml"]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (connect-grow)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connect-grow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: connect-grow/package-lock.json
      - run: npm ci
      # Pas de continue-on-error : un échec de lint fait échouer la CI.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
